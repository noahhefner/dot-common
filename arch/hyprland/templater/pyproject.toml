[project]
name = "templater"
version = "0.1.0"
description = "Templater for dotfiles"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.15.14",
    "ty>=0.0.39",
    "uv-upsync>=2.3.2",
]
